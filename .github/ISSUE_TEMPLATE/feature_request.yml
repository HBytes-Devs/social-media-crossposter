name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or early feedback, consider a [Discussion](https://github.com/HBytes-Devs/social-media-crossposter/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or business problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your view)
      options:
        - Nice to have
        - Should have
        - Must have
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms affected
      options:
        - label: LinkedIn
        - label: Reddit
        - label: Facebook / Instagram
        - label: X (Twitter)
        - label: Cross-cutting (all platforms)
