<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HawkBytes</title>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #e8eef7;
        --muted: #93a0b5;
        --accent: #3dd6c6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 600px at 10% -10%, #16324f 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #1a3a2e 0%, transparent 50%),
          var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .brand {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0 0 0.75rem;
      }
      .brand span { color: var(--accent); }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        max-width: 28rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1 class="brand">Hawk<span>Bytes</span></h1>
        <p>Site is ready on Contabo. Content coming soon.</p>
      </div>
    </main>
  </body>
</html>
