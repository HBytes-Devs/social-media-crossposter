upstream smc_frontend {
  server frontend:80;
}

upstream smc_backend {
  server backend:3001;
}

# ACME + HTTP → HTTPS for sslip hostname
server {
  listen 80;
  server_name 169.58.63.125.sslip.io;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://169.58.63.125.sslip.io$request_uri;
  }
}

# Company site — hawkbytes.com (HTTP only until DNS+certs exist)
server {
  listen 80;
  server_name hawkbytes.com www.hawkbytes.com;

  root /var/www/hawkbytes;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Raw IP / default — keep HTTP working
server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location /api/ {
    proxy_pass http://smc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://smc_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# SMC app — HTTPS (sslip)
server {
  listen 443 ssl;
  http2 on;
  server_name 169.58.63.125.sslip.io;

  ssl_certificate     /etc/letsencrypt/live/169.58.63.125.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/169.58.63.125.sslip.io/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  location /public/ {
    alias /var/www/smc-public/;
    default_type image/jpeg;
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://smc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://smc_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
